# SF-01: recursos descartables. Usar siempre -f y un proyecto nuevo con -p.
# No combina ni reutiliza los contenedores/volumen del docker-compose.yml original.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sf01_demo
      POSTGRES_PASSWORD: sf01_local_disposable
      POSTGRES_DB: sf01_demo
    ports:
      - "127.0.0.1:${SF01_DB_PORT:-15432}:5432"
    volumes:
      - recovery_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf01_demo -d sf01_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.sinfreno.purpose: sf01-disposable

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://sf01_demo:sf01_local_disposable@db:5432/sf01_demo
      SECRET_KEY: sf01-local-demo-disposable-key-do-not-deploy
      CORS_ORIGINS: '["http://127.0.0.1:15173","http://localhost:15173"]'
      TELEGRAM_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    ports:
      - "127.0.0.1:${SF01_API_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    labels:
      com.sinfreno.purpose: sf01-disposable

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.recovery
    environment:
      VITE_BACKEND_URL: http://127.0.0.1:${SF01_API_PORT:-18000}
    ports:
      - "127.0.0.1:15173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    labels:
      com.sinfreno.purpose: sf01-disposable

# Compose crea una red dedicada por proyecto. La red ordinaria permite publicar
# los puertos de loopback en Docker Desktop; Telegram queda deshabilitado arriba
# con TELEGRAM_TOKEN y TELEGRAM_CHAT_ID vacíos.

volumes:
  recovery_postgres:
    labels:
      com.sinfreno.purpose: sf01-disposable
