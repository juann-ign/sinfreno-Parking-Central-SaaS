name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit
      - run: npm audit --omit=dev

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: release_demo
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: release_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_demo -d release_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://release_demo:ci-only-disposable@127.0.0.1:5432/release_disposable
      CORS_ORIGINS: '["http://127.0.0.1:15175"]'
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      RELEASE_ALLOW_RESET: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/requirements*.lock
      - run: python -m pip install -r requirements-dev.txt
      - name: Create an ephemeral signing key for this test job
        run: |
          python -c "import os,secrets; open(os.environ['GITHUB_ENV'],'a').write('SECRET_KEY='+secrets.token_hex(48)+'\n')"
      - run: python -m pip check
      - run: alembic upgrade head
      - run: python -m pytest -q -rs -p no:cacheprovider --junitxml=../.recovery/ci-tests.xml tests
      - name: Reject an incomplete test run
        run: >-
          python -c "import xml.etree.ElementTree as E;
          suites=list(E.parse('../.recovery/ci-tests.xml').getroot().iter('testsuite'));
          assert sum(int(s.get('tests', 0)) for s in suites) > 0, 'No tests collected';
          assert sum(int(s.get('skipped', 0)) for s in suites) == 0, 'Skipped tests require explicit review'"
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
      - run: python -m pip_audit -r requirements-dev.txt --progress-spinner off

  release-image-proxy:
    name: Release images, restore and HTTPS/WSS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Prepare this runner's disposable release environment
        id: release_environment
        run: |
          # The scripts expect this context; it exists only on this ephemeral runner.
          docker context create desktop-linux --docker host=unix:///var/run/docker.sock
          echo 'context_created=true' >> "$GITHUB_OUTPUT"
          node scripts/init-release.mjs
      - name: Build and start only the release database and API
        run: >-
          docker --context desktop-linux compose --env-file .recovery/release.env
          -p sinfreno-release-20261115 -f docker-compose.release.yml
          up -d --build --wait --wait-timeout 180 db backend
      - name: Verify normal startup creates no accounts
        run: |
          users=$(docker --context desktop-linux compose --env-file .recovery/release.env \
            -p sinfreno-release-20261115 -f docker-compose.release.yml \
            exec -T db psql -U release_demo -d release_disposable \
            -v ON_ERROR_STOP=1 -Atqc 'SELECT count(*) FROM public.usuarios;')
          if [ "$users" != '0' ]; then
            echo 'Fresh release startup unexpectedly created accounts.' >&2
            exit 1
          fi
      - name: Seed the disposable release explicitly
        run: >-
          docker --context desktop-linux compose --env-file .recovery/release.env
          -p sinfreno-release-20261115 -f docker-compose.release.yml
          exec -T backend python -m app.seed --confirm-disposable release_disposable
      - name: Verify binary backup and restore into a new disposable database
        run: node scripts/test-release-backup.mjs --confirm-disposable
      - name: Build the production frontend image
        run: >-
          docker --context desktop-linux build -t sinfreno-release-frontend-static:20261115
          -f frontend/Dockerfile.production frontend
      - name: Load the local HTTPS gateway image
        run: docker --context desktop-linux pull caddy:2-alpine
      - name: Verify local HTTPS, proxy trust and authenticated WSS
        run: node scripts/test-release-proxy.mjs --confirm-disposable
      - name: Remove only this job's disposable resources and private files
        if: ${{ always() }}
        env:
          RELEASE_CONTEXT_CREATED: ${{ steps.release_environment.outputs.context_created }}
        run: |
          cleanup_status=0
          if [ "$RELEASE_CONTEXT_CREATED" = 'true' ]; then
            # QA must detach from the release network before that network is removed.
            # Labels avoid relying on proxy-qa.env, which the test removes itself.
            for project in sinfreno-release-proxy-qa sinfreno-release-20261115; do
              docker --context desktop-linux container ls --all --quiet \
                --filter "label=com.docker.compose.project=$project" \
                | xargs --no-run-if-empty docker --context desktop-linux container rm --force --volumes \
                || cleanup_status=1
              docker --context desktop-linux network ls --quiet \
                --filter "label=com.docker.compose.project=$project" \
                | xargs --no-run-if-empty docker --context desktop-linux network rm \
                || cleanup_status=1
              docker --context desktop-linux volume ls --quiet \
                --filter "label=com.docker.compose.project=$project" \
                | xargs --no-run-if-empty docker --context desktop-linux volume rm \
                || cleanup_status=1
            done
            docker context rm desktop-linux || cleanup_status=1
          fi
          rm -f -- .recovery/release.env .recovery/proxy-qa.env \
            .recovery/release-backup-*.dump .recovery/proxy-qa-ca-*.crt
          exit "$cleanup_status"
